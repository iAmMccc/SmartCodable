# This workflow will build a Swift project
# For more information: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches:
      - "main"
      - "7.1.0"
      - "fix/smartflat-snapshot-pollution"
      - "refactor/decoder-context"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Compile public API consumer
      run: swift run --package-path Tools/PublicAPISmoke PublicAPISmoke
    - name: Build Release
      run: swift build -c release
    - name: Test Release
      run: swift test -c release

  thread-sanitizer:

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    # 保留全局选项与日志哨兵共享状态的并发回归覆盖。
    - name: Run Thread Sanitizer concurrency tests
      run: |
        swift test --sanitize=thread --filter GlobalOptionsConcurrencyTests > "$RUNNER_TEMP/tsan-global.log" 2>&1 || { cat "$RUNNER_TEMP/tsan-global.log"; exit 1; }
        cat "$RUNNER_TEMP/tsan-global.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/tsan-global.log"
    # 覆盖独立 decoder 并发回退默认值的路径；零匹配也视为失败。
    - name: Run Thread Sanitizer decoding context concurrency test
      run: |
        swift test --sanitize=thread --filter DecodingContextTests.testConcurrentIndependentDecodersFallbackDefaultsStayIsolated > "$RUNNER_TEMP/tsan-context.log" 2>&1 || { cat "$RUNNER_TEMP/tsan-context.log"; exit 1; }
        cat "$RUNNER_TEMP/tsan-context.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/tsan-context.log"
    # 覆盖共享 decoder 在固定配置下的并发会话隔离；零匹配也视为失败。
    - name: Run Thread Sanitizer shared decoder sessions concurrency test
      run: |
        swift test --sanitize=thread --filter RootCauseFixTests.testConcurrentSharedDecoderSessionsStayDistinctWithFixedConfiguration > "$RUNNER_TEMP/tsan-shared-sessions.log" 2>&1 || { cat "$RUNNER_TEMP/tsan-shared-sessions.log"; exit 1; }
        cat "$RUNNER_TEMP/tsan-shared-sessions.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/tsan-shared-sessions.log"
    # 覆盖共享 decoder 并发日志按调用隔离会话；零匹配也视为失败。
    - name: Run Thread Sanitizer shared decoder logs concurrency test
      run: |
        swift test --sanitize=thread --filter RootCauseFixTests.testSharedDecoderConcurrentLogsKeepOneSessionPerCall > "$RUNNER_TEMP/tsan-shared-logs.log" 2>&1 || { cat "$RUNNER_TEMP/tsan-shared-logs.log"; exit 1; }
        cat "$RUNNER_TEMP/tsan-shared-logs.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/tsan-shared-logs.log"

  property-tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/7.1.0'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Run isolated PropertyBased tests
      run: swift test --package-path Tools/PropertyTests
