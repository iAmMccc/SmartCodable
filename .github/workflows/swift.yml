# This workflow will build a Swift project
# For more information: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches:
      - "main"
      - "fix/smartflat-snapshot-pollution"
      - "refactor/decoder-context"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Build Release
      run: swift build -c release
    - name: Test Release
      run: swift test -c release

  thread-sanitizer:

    runs-on: macos-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    # 保留全局选项与日志哨兵共享状态的并发回归覆盖。
    - name: Run Thread Sanitizer concurrency tests
      run: swift test --sanitize=thread --filter GlobalOptionsConcurrencyTests
    # 覆盖独立 decoder 并发回退默认值的路径；使用精确过滤器，确保日志能证明目标用例实际执行。
    - name: Run Thread Sanitizer decoding context concurrency test
      run: swift test --sanitize=thread --filter DecodingContextTests.testConcurrentIndependentDecodersFallbackDefaultsStayIsolated
